module_name: coax_mixer
parameters:
- group: Coaxial Mixer
  definitions:
    CM_CYC_MAX:
      description:
        short: Cyclic flap amplitude per rotor at full roll/pitch torque setpoint, at CM_RPM_REF
      type: float
      default: 8.0
      unit: deg
      decimal: 2
    CM_DIFF_MAX:
      description:
        short: Differential flap at full yaw torque setpoint, at CM_RPM_REF
      type: float
      default: 6.0
      unit: deg
      decimal: 2
    CM_FLAP_MIN:
      description:
        short: Flap deflection at servo output -1 (trailing edge down positive)
      type: float
      default: -10.0
      unit: deg
      decimal: 1
    CM_FLAP_MAX:
      description:
        short: Flap deflection at servo output +1
      type: float
      default: 10.0
      unit: deg
      decimal: 1
    CM_RPM_REF:
      description:
        short: Rotor speed at which CM_CYC_MAX and CM_DIFF_MAX apply
      type: float
      default: 600.0
      unit: rpm
      decimal: 0
    CM_RPM_MAX:
      description:
        short: Rotor speed at motor output 1 (thrust setpoint 1)
      type: float
      default: 750.0
      unit: rpm
      decimal: 0
    CM_SRV_TAU:
      description:
        short: Flap servo time constant for 1/rev lag compensation
      type: float
      default: 0.015
      unit: s
      decimal: 3
    CM_SRV_RATE:
      description:
        short: Flap servo rate limit for cyclic amplitude limiting
      type: float
      default: 400.0
      unit: deg/s
      decimal: 0
    CM_AZ_OFF:
      description:
        short: Encoder azimuth offset added to the measured azimuth
      type: float
      default: 0.0
      unit: deg
      decimal: 1
